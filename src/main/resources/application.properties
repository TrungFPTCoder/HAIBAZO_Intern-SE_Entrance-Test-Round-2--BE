spring.application.name=bookreview
spring.profiles.active=local

# 1. Server Port (Mặc định là 8080, có thể đổi nếu bị trùng)
server.port=8080
server.servlet.context-path=/api

# 2. Cấu hình kết nối PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookreview}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# 3. Cấu hình Hibernate tự sinh bảng dựa trên Entity
spring.jpa.hibernate.ddl-auto=update

# 4. Hiển thị các câu lệnh SQL xuống Console để tiện debug khi gọi API
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Đảm bảo Hibernate hiểu đúng cú pháp của PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect